# ============================================================
# APPLICATION
# ============================================================

spring.application.name=tamilnadu-gov-api


# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# MYSQL DATABASE
# ============================================================

spring.datasource.url=jdbc:mysql://68.233.99.23:3306/tamilnadu_gov_pds?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=*****
spring.datasource.password=*****

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

# Automatically create/update database tables from entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=false

# Format generated SQL
spring.jpa.properties.hibernate.format_sql=true

# Prevent Hibernate from keeping DB session open during API response
spring.jpa.open-in-view=false

# Hibernate timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


# ============================================================
# MYSQL / HIBERNATE DIALECT
# ============================================================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ============================================================
# JSON / JACKSON
# ============================================================

spring.jackson.time-zone=Asia/Kolkata


# ============================================================
# SPRING MVC
# ============================================================

spring.mvc.servlet.path=/


# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-sorter=method

springdoc.swagger-ui.tags-sorter=alpha


# ============================================================
# LOGGING
# ============================================================

logging.level.com.kamalkavin96.tamilnadu_gov_api=INFO

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=INFO

logging.level.org.hibernate.orm.jdbc.bind=INFO

logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata